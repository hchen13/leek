[workspace]
resolver = "2"
members = ["crates/gateway"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ethan Chen <gradschool.hchen13@gmail.com>"]
rust-version = "1.85"

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime + HTTP
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# HTTP server
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Crypto / OAuth helpers
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

# Static asset embedding (frontend/web/dist → binary)
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
mime_guess = "2"

# Corpus parsing
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
notify = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
