[workspace]
resolver = "2"
members = ["crates/gateway"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ethan Chen <gradschool.hchen13@gmail.com>"]
rust-version = "1.85"

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime + HTTP server
tokio = { version = "1.47", features = ["full"] }
axum = { version = "0.8" }
tower-http = { version = "0.6", features = ["cors"] }
async-stream = "0.3"
futures = "0.3"

# HTTP client — codex backend (Responses API) + the web_fetch tool
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
# `Bytes` type shared with reqwest's bytes_stream — used by the F2
# transcript tap in `llm::codex` (parse_sse_stream's generic bound).
bytes = "1"

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
# JWT exp decoding for codex tokens — payload only, no signature verification
base64 = "0.22"

# Diagnostics
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tokenizer — auto-compaction's leek-side estimator (M2.5). Aligned
# with gpt-5.5's BPE (o200k_base); codex's reported `input_tokens` is
# polluted by builtin web_search, so leek tokenizes its own request.
tiktoken-rs = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
