[package]
name = "leek-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "leek"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tiktoken-rs = { workspace = true }

[dev-dependencies]
# M3.4 retry tests need `tokio::time::pause`, which lives behind the
# `test-util` feature. Adding it as a dev-dependency keeps the
# production binary lean while letting unit tests virtualize the
# retry-loop backoff sleeps (1s + 4s) so the suite stays sub-second.
tokio = { version = "1.47", features = ["full", "test-util"] }
